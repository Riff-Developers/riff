[package]
name = "riff-playback"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Riff's playback: the playback state machine, the local player and remote devices."

[dependencies]
riff-api = { path = "../riff-api" }
riff-audio-engine = { path = "../riff-audio-engine" }
riff-auth = { path = "../riff-auth" }
riff-config = { path = "../riff-config" }
riff-core = { path = "../riff-core" }
flate2 = "1"
tar = "0.4"
futures = "0.3.18"
httpdate = "1"
libc = "0.2"
log = "0.4.17"
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.96"
sha2 = "0.10"
url = "2.4.1"
reqwest = "0.12"

[dependencies.librespot]
version = "0.8.0"
default-features = false
features = ["alsa-backend", "pulseaudio-backend", "native-tls", "with-libmdns"]

[dependencies.tokio]
version = "1"
features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "fs"]

[dependencies.tokio-tungstenite]
version = "0.28"
default-features = false
features = ["connect"]

[lints]
workspace = true
