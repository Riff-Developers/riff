[package]
name = "riff-config"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Riff's user and app configuration."

[features]
default = ["gio"]
gio = ["dep:gio", "dep:log"]

[dependencies]
gio = { version = "0.22", optional = true }
log = { version = "0.4.17", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.96"

[lints]
workspace = true
